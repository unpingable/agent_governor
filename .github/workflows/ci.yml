name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"

    env:
      RECEIPT_DIR: .gov/ci/${{ github.sha }}/py${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}
          key: ${{ runner.os }}-pip-v2-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-v2-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,webui]"
          pip install -e libs/receipt_kernel
          pip install -e libs/receipt_v1

      - name: Run tests
        continue-on-error: true
        run: |
          governor wrap --receipt-out "$RECEIPT_DIR" --ci-kind unit_tests -- \
            pytest tests/ -v --tb=short -q

      - name: Show test failures (diagnostic, macOS only)
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        run: |
          pytest tests/ --tb=short -q 2>&1 | tail -50

      - name: Verify CI receipts
        run: |
          governor ci verify "$RECEIPT_DIR"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-receipts-py${{ matrix.python-version }}-${{ matrix.os }}
          path: .gov/ci/
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest

    env:
      RECEIPT_DIR: .gov/ci/${{ github.sha }}/lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff==0.15.0

      - name: Run ruff check
        continue-on-error: true
        run: |
          governor wrap --receipt-out "$RECEIPT_DIR" --ci-kind lint -- \
            ruff check src/ tests/ libs/ --output-format=github

      - name: Verify CI receipts
        run: |
          governor ci verify "$RECEIPT_DIR"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-receipts-lint
          path: .gov/ci/
          retention-days: 30
