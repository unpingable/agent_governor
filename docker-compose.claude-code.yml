# Agent Governor WebUI — Claude Code Backend Override
#
# Use with: docker-compose -f docker-compose.yml -f docker-compose.claude-code.yml up -d
#
# Routes chat through the `claude` CLI to use your Claude Max subscription
# instead of paying API credits.
#
# Requirements:
#   - Claude Code CLI installed and authenticated on the host
#   - Set CLAUDE_VERSION to match your installed version (check ~/.local/share/claude/versions/)
#
# Example:
#   CLAUDE_VERSION=2.1.31 docker-compose -f docker-compose.yml -f docker-compose.claude-code.yml up -d

services:
  fiction-adapter:
    environment:
      - BACKEND_TYPE=claude-code
      - CLAUDE_PATH=/opt/claude/claude
    volumes:
      # Mount the actual claude binary (symlinks don't work with Docker mounts)
      # Find your version with: ls ~/.local/share/claude/versions/
      - ${HOME}/.local/share/claude/versions/${CLAUDE_VERSION:-2.1.31}:/opt/claude/claude:ro
      # Mount claude config/auth from host
      - ${HOME}/.claude:/root/.claude:ro
      - ${HOME}/.config/claude:/root/.config/claude:ro

  code-adapter:
    environment:
      - BACKEND_TYPE=claude-code
      - CLAUDE_PATH=/opt/claude/claude
    volumes:
      # Mount the actual claude binary (symlinks don't work with Docker mounts)
      - ${HOME}/.local/share/claude/versions/${CLAUDE_VERSION:-2.1.31}:/opt/claude/claude:ro
      # Mount claude config/auth from host
      - ${HOME}/.claude:/root/.claude:ro
      - ${HOME}/.config/claude:/root/.config/claude:ro
