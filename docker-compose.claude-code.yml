# Agent Governor WebUI — Claude Code Backend Override
#
# Use with: docker-compose -f docker-compose.yml -f docker-compose.claude-code.yml up -d
#
# Routes chat through the `claude` CLI to use your Claude Max subscription
# instead of paying API credits.
#
# Requirements:
#   - Claude Code CLI installed and authenticated on the host
#   - Set CLAUDE_VERSION to match your installed version:
#       ls ~/.local/share/claude/versions/
#
# IMPORTANT: If using snap Docker, $HOME resolves to the snap's home directory,
# not your actual home. Set REAL_HOME explicitly:
#
#   REAL_HOME=/home/youruser CLAUDE_VERSION=2.1.31 \
#     docker-compose -f docker-compose.yml -f docker-compose.claude-code.yml up -d --build

services:
  fiction-adapter:
    environment:
      - BACKEND_TYPE=claude-code
      - CLAUDE_PATH=/opt/claude/claude
    volumes:
      # Mount claude binary (resolve REAL_HOME for snap Docker compatibility)
      - ${REAL_HOME:-${HOME}}/.local/share/claude/versions/${CLAUDE_VERSION:-2.1.31}:/opt/claude/claude:ro
      # Mount credentials file (read-only) for authentication
      - ${REAL_HOME:-${HOME}}/.claude/.credentials.json:/root/.claude/.credentials.json:ro

  code-adapter:
    environment:
      - BACKEND_TYPE=claude-code
      - CLAUDE_PATH=/opt/claude/claude
    volumes:
      - ${REAL_HOME:-${HOME}}/.local/share/claude/versions/${CLAUDE_VERSION:-2.1.31}:/opt/claude/claude:ro
      - ${REAL_HOME:-${HOME}}/.claude/.credentials.json:/root/.claude/.credentials.json:ro
