# Agent Governor WebUI — Multi-User Stack
#
# Run: docker-compose up -d
#
# Users:
#   - Erin (fiction):  WebUI at http://localhost:3001, adapter at http://localhost:8001
#   - James (code):    WebUI at http://localhost:3002, adapter at http://localhost:8002
#
# Requires: ANTHROPIC_API_KEY in .env or environment
#
# For local Ollama usage instead, see docker-compose.ollama.yml

services:
  # ============================================================
  # Erin's fiction writing stack
  # ============================================================

  erin-adapter:
    build:
      context: .
      dockerfile: Dockerfile.adapter
    container_name: governor-erin-adapter
    ports:
      - "8001:8000"
    environment:
      - BACKEND_TYPE=anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOVERNOR_CONTEXT_ID=erin-current-novel
      - GOVERNOR_MODE=fiction
      - GOVERNOR_CONTEXTS_DIR=/contexts
    volumes:
      - contexts_data:/contexts
    restart: unless-stopped

  erin-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: governor-erin-webui
    ports:
      - "3001:8080"
    environment:
      - OPENAI_API_BASE_URL=http://erin-adapter:8000/v1
      - OPENAI_API_KEY=not-needed
      - WEBUI_AUTH=false
      - WEBUI_NAME=Erin's Writing Studio
    volumes:
      - erin_webui_data:/app/backend/data
    depends_on:
      - erin-adapter
    restart: unless-stopped

  # ============================================================
  # James's code development stack
  # ============================================================

  james-adapter:
    build:
      context: .
      dockerfile: Dockerfile.adapter
    container_name: governor-james-adapter
    ports:
      - "8002:8000"
    environment:
      - BACKEND_TYPE=anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOVERNOR_CONTEXT_ID=james-current-project
      - GOVERNOR_MODE=code
      - GOVERNOR_CONTEXTS_DIR=/contexts
    volumes:
      - contexts_data:/contexts
    restart: unless-stopped

  james-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: governor-james-webui
    ports:
      - "3002:8080"
    environment:
      - OPENAI_API_BASE_URL=http://james-adapter:8000/v1
      - OPENAI_API_KEY=not-needed
      - WEBUI_AUTH=false
      - WEBUI_NAME=James's Dev Console
    volumes:
      - james_webui_data:/app/backend/data
    depends_on:
      - james-adapter
    restart: unless-stopped

volumes:
  contexts_data:
  erin_webui_data:
  james_webui_data:
