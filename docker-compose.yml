# Agent Governor WebUI — Multi-User Stack
#
# Run: docker-compose up -d
#
# Stacks:
#   - Fiction:  WebUI at http://localhost:3001, adapter at http://localhost:8001
#   - Code:     WebUI at http://localhost:3002, adapter at http://localhost:8002
#
# Requires: ANTHROPIC_API_KEY in .env or environment
#
# For local Ollama usage instead, see docker-compose.ollama.yml

services:
  # ============================================================
  # Fiction writing stack
  # ============================================================

  fiction-adapter:
    build:
      context: .
      dockerfile: Dockerfile.adapter
    container_name: governor-fiction-adapter
    ports:
      - "8001:8000"
    environment:
      - BACKEND_TYPE=anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOVERNOR_CONTEXT_ID=fiction-current-novel
      - GOVERNOR_MODE=fiction
      - GOVERNOR_CONTEXTS_DIR=/contexts
    volumes:
      - contexts_data:/contexts
    restart: unless-stopped

  fiction-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: governor-fiction-webui
    ports:
      - "3001:8080"
    environment:
      - OPENAI_API_BASE_URL=http://fiction-adapter:8000/v1
      - OPENAI_API_KEY=not-needed
      - WEBUI_AUTH=false
      - WEBUI_NAME=Fiction Writing Studio
    volumes:
      - fiction_webui_data:/app/backend/data
    depends_on:
      - fiction-adapter
    restart: unless-stopped

  # ============================================================
  # Code development stack
  # ============================================================

  code-adapter:
    build:
      context: .
      dockerfile: Dockerfile.adapter
    container_name: governor-code-adapter
    ports:
      - "8002:8000"
    environment:
      - BACKEND_TYPE=anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOVERNOR_CONTEXT_ID=code-current-project
      - GOVERNOR_MODE=code
      - GOVERNOR_CONTEXTS_DIR=/contexts
    volumes:
      - contexts_data:/contexts
    restart: unless-stopped

  code-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: governor-code-webui
    ports:
      - "3002:8080"
    environment:
      - OPENAI_API_BASE_URL=http://code-adapter:8000/v1
      - OPENAI_API_KEY=not-needed
      - WEBUI_AUTH=false
      - WEBUI_NAME=Code Development Console
    volumes:
      - code_webui_data:/app/backend/data
    depends_on:
      - code-adapter
    restart: unless-stopped

volumes:
  contexts_data:
  fiction_webui_data:
  code_webui_data:
