<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Governor Lab</title>
<style>
  :root {
    --bg: #1a1b26;
    --surface: #24283b;
    --surface2: #2f3349;
    --border: #3b4261;
    --text: #c0caf5;
    --text-dim: #565f89;
    --accent: #7aa2f7;
    --green: #9ece6a;
    --red: #f7768e;
    --yellow: #e0af68;
    --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header .tag {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--text-dim);
    background: var(--surface2);
    padding: 2px 8px;
    border-radius: 4px;
  }

  header .reset-btn {
    margin-left: auto;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--text-dim);
    background: none;
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
  }

  header .reset-btn:hover { color: var(--text); border-color: var(--text-dim); }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr;
    gap: 0;
    height: calc(100vh - 65px);
  }

  .panel {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel:nth-child(even) { border-right: none; }

  .panel-header {
    padding: 12px 16px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-body {
    padding: 16px;
    flex: 1;
    overflow-y: auto;
    background: var(--bg);
  }

  /* Input panel */
  #input-text {
    width: 100%;
    height: 100%;
    min-height: 120px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    font-family: var(--mono);
    font-size: 13px;
    resize: none;
    outline: none;
    line-height: 1.6;
  }

  #input-text:focus { border-color: var(--accent); }

  #input-text::placeholder { color: var(--text-dim); }

  .input-footer {
    padding: 12px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .run-btn {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 8px 24px;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .run-btn:hover { opacity: 0.85; }
  .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .strict-toggle {
    font-size: 12px;
    font-family: var(--mono);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }

  .strict-toggle input { accent-color: var(--accent); }

  .hint {
    font-size: 11px;
    color: var(--text-dim);
    margin-left: auto;
    font-family: var(--mono);
  }

  /* Result panel */
  .status-badge {
    display: inline-block;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 6px;
    letter-spacing: 0.04em;
  }

  .status-OK { background: var(--green); color: var(--bg); }
  .status-WARN { background: var(--yellow); color: var(--bg); }
  .status-BLOCKED { background: var(--red); color: var(--bg); }

  .result-section {
    margin-top: 16px;
  }

  .result-section h3 {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .reason-list {
    list-style: none;
    font-family: var(--mono);
    font-size: 12px;
  }

  .reason-list li {
    padding: 4px 0;
    color: var(--red);
  }

  .reason-list li.warning { color: var(--yellow); }

  .claim-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-family: var(--mono);
    font-size: 12px;
  }

  .claim-level {
    font-weight: 700;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .claim-level.HARD { color: var(--red); }
  .claim-level.SOFT { color: var(--yellow); }

  .claim-text { color: var(--text); margin-top: 4px; }
  .claim-evidence { color: var(--green); margin-top: 2px; font-size: 11px; }
  .claim-no-evidence { color: var(--red); margin-top: 2px; font-size: 11px; }

  /* Receipt panel */
  .receipt-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    font-family: var(--mono);
    font-size: 12px;
  }

  .receipt-field {
    display: flex;
    padding: 3px 0;
  }

  .receipt-key {
    color: var(--text-dim);
    width: 130px;
    flex-shrink: 0;
  }

  .receipt-value {
    color: var(--text);
    word-break: break-all;
  }

  .receipt-value.verdict-pass { color: var(--green); }
  .receipt-value.verdict-block { color: var(--red); }
  .receipt-value.verdict-warn { color: var(--yellow); }

  /* History panel */
  .history-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }

  .history-item:hover { background: var(--surface); }
  .history-item:last-child { border-bottom: none; }

  .history-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    width: 20px;
    text-align: right;
    flex-shrink: 0;
    padding-top: 2px;
  }

  .history-badge {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .history-text {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty-state {
    color: var(--text-dim);
    font-size: 13px;
    font-style: italic;
    padding: 20px 0;
    text-align: center;
  }

  .cli-hint {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface2);
    padding: 8px 12px;
    border-radius: 4px;
    margin-top: 12px;
    user-select: all;
  }

  .cli-hint::before {
    content: '$ ';
    color: var(--accent);
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>Governor Lab</h1>
  <span class="tag">evidence gate demo</span>
  <button class="reset-btn" onclick="resetState()">reset state</button>
</header>

<div class="layout">
  <!-- Input Panel -->
  <div class="panel">
    <div class="panel-header">Agent Output</div>
    <div class="panel-body">
      <textarea id="input-text" placeholder="Type agent output to check...&#10;&#10;Try: &quot;I guarantee this is correct.&quot;&#10;Then: &quot;The tests pass (see test_foo.py:12).&quot;"></textarea>
    </div>
    <div class="input-footer">
      <button class="run-btn" id="run-btn" onclick="runCheck()">Check</button>
      <label class="strict-toggle">
        <input type="checkbox" id="strict-mode" checked>
        strict
      </label>
      <span class="hint" id="shortcut-hint">Ctrl+Enter</span>
    </div>
  </div>

  <!-- Result Panel -->
  <div class="panel">
    <div class="panel-header">
      Gate Decision
      <span id="result-status-small"></span>
    </div>
    <div class="panel-body" id="result-panel">
      <div class="empty-state">Run a check to see the gate decision.</div>
    </div>
  </div>

  <!-- Receipt Panel -->
  <div class="panel">
    <div class="panel-header">Receipt</div>
    <div class="panel-body" id="receipt-panel">
      <div class="empty-state">Receipts appear here after each check.</div>
    </div>
  </div>

  <!-- History Panel -->
  <div class="panel">
    <div class="panel-header">
      History
      <span id="run-count" style="margin-left: auto; font-family: var(--mono); font-size: 11px;"></span>
    </div>
    <div class="panel-body" id="history-panel">
      <div class="empty-state">Run history builds here.</div>
    </div>
  </div>
</div>

<script>
const history = [];

document.getElementById('input-text').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runCheck();
  }
});

async function runCheck() {
  const text = document.getElementById('input-text').value.trim();
  if (!text) return;

  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  const strict = document.getElementById('strict-mode').checked;

  try {
    const resp = await fetch('/api/check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, strict }),
    });
    const data = await resp.json();
    displayResult(data, text, strict);
  } catch (err) {
    document.getElementById('result-panel').innerHTML =
      `<div class="empty-state">Error: ${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Check';
  }
}

function displayResult(data, text, strict) {
  const gate = data.gate || {};
  const receipt = data.receipt;
  const status = gate.status || 'UNKNOWN';

  // Result panel
  const resultPanel = document.getElementById('result-panel');
  let html = `<span class="status-badge status-${status}">${status}</span>`;

  // CLI equivalent
  const mode = strict ? '--strict' : '--permissive';
  html += `<div class="cli-hint">echo '...' | governor gate check --stdin ${mode} --format json</div>`;

  // Blocking reasons
  if (gate.blocking_reasons && gate.blocking_reasons.length > 0) {
    html += '<div class="result-section"><h3>Blocking Reasons</h3><ul class="reason-list">';
    gate.blocking_reasons.forEach(r => { html += `<li>${esc(r)}</li>`; });
    html += '</ul></div>';
  }

  // Warnings
  if (gate.warnings && gate.warnings.length > 0) {
    html += '<div class="result-section"><h3>Warnings</h3><ul class="reason-list">';
    gate.warnings.forEach(w => { html += `<li class="warning">${esc(w)}</li>`; });
    html += '</ul></div>';
  }

  // Claims
  if (gate.claims && gate.claims.length > 0) {
    html += '<div class="result-section"><h3>Claims Extracted</h3>';
    gate.claims.forEach(c => {
      html += `<div class="claim-item">
        <span class="claim-level ${c.level}">${c.level}</span>
        <div class="claim-text">"${esc(c.text)}"</div>
        ${c.evidence
          ? `<div class="claim-evidence">evidence: ${esc(c.evidence)}</div>`
          : `<div class="claim-no-evidence">no evidence</div>`
        }
      </div>`;
    });
    html += '</div>';
  } else if (status === 'OK') {
    html += '<div class="result-section"><h3>Claims</h3><div style="color:var(--text-dim);font-size:12px;">No HARD claims detected. Text passes without evidence requirements.</div></div>';
  }

  resultPanel.innerHTML = html;

  // Receipt panel
  const receiptPanel = document.getElementById('receipt-panel');
  if (receipt) {
    const vclass = receipt.verdict === 'pass' ? 'verdict-pass'
      : receipt.verdict === 'block' ? 'verdict-block' : 'verdict-warn';

    receiptPanel.innerHTML = `<div class="receipt-card">
      <div class="receipt-field"><span class="receipt-key">receipt_id</span><span class="receipt-value">${esc(receipt.receipt_id)}</span></div>
      <div class="receipt-field"><span class="receipt-key">gate</span><span class="receipt-value">${esc(receipt.gate)}</span></div>
      <div class="receipt-field"><span class="receipt-key">verdict</span><span class="receipt-value ${vclass}">${esc(receipt.verdict)}</span></div>
      <div class="receipt-field"><span class="receipt-key">subject_hash</span><span class="receipt-value">${esc(receipt.subject_hash)}</span></div>
      <div class="receipt-field"><span class="receipt-key">evidence_hash</span><span class="receipt-value">${esc(receipt.evidence_hash)}</span></div>
      <div class="receipt-field"><span class="receipt-key">policy_hash</span><span class="receipt-value">${esc(receipt.policy_hash)}</span></div>
      <div class="receipt-field"><span class="receipt-key">timestamp</span><span class="receipt-value">${esc(receipt.timestamp)}</span></div>
      <div class="receipt-field"><span class="receipt-key">schema</span><span class="receipt-value">v${receipt.schema_version}</span></div>
    </div>
    <div class="cli-hint">governor receipts --json --last 1</div>`;
  } else {
    receiptPanel.innerHTML = '<div class="empty-state">No receipt emitted.</div>';
  }

  // History
  const entry = {
    num: history.length + 1,
    text: text,
    status: status,
    strict: strict,
    receipt_id: receipt ? receipt.receipt_id.slice(0, 12) : null,
    claims: (gate.claims || []).length,
  };
  history.push(entry);
  renderHistory();
}

function renderHistory() {
  const panel = document.getElementById('history-panel');
  document.getElementById('run-count').textContent = `${history.length} run${history.length !== 1 ? 's' : ''}`;

  let html = '';
  for (let i = history.length - 1; i >= 0; i--) {
    const h = history[i];
    const color = h.status === 'OK' ? 'var(--green)'
      : h.status === 'BLOCKED' ? 'var(--red)' : 'var(--yellow)';
    html += `<div class="history-item" onclick="loadHistoryItem(${i})">
      <span class="history-num">${h.num}</span>
      <span class="history-badge" style="background:${color};color:var(--bg);">${h.status}</span>
      <span class="history-text">${esc(h.text)}</span>
    </div>`;
  }
  panel.innerHTML = html || '<div class="empty-state">Run history builds here.</div>';
}

function loadHistoryItem(idx) {
  document.getElementById('input-text').value = history[idx].text;
  document.getElementById('strict-mode').checked = history[idx].strict;
}

async function resetState() {
  if (!confirm('Reset governor state? This clears all receipts.')) return;
  await fetch('/api/reset', { method: 'POST' });
  history.length = 0;
  document.getElementById('result-panel').innerHTML = '<div class="empty-state">Run a check to see the gate decision.</div>';
  document.getElementById('receipt-panel').innerHTML = '<div class="empty-state">Receipts appear here after each check.</div>';
  renderHistory();
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
</script>

</body>
</html>
