[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ag-shell-client"
version = "0.1.0"
description = "Governor daemon shell client — the contract surface operator shells (maude, phosphor) rely on. AG's mouth, not a shell's guts."
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "James Beck" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-timeout>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ag_shell_client"]
