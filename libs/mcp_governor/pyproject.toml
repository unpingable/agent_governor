[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-governor"
version = "0.1.0"
description = "MCP Governor Gateway: policy-enforcing proxy for MCP tool servers"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "James Beck" }
]
dependencies = [
    "receipt-v1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_governor"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "config/",
    "demos/",
    "tests/",
    "pyproject.toml",
    "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 30
