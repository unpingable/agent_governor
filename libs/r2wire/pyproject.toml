[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "r2wire"
version = "0.2.0"
description = "R2-WIRE: Minimal typed wire protocol for LLM/agent coordination"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "James Beck" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/r2wire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 30
