[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt-kernel"
version = "0.1.0"
description = "Append-only, hash-chained run ledger with invariant evaluation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "James Beck" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 30
