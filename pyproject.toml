[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-governor"
version = "0.1.0"
description = "Agent Governor - constraint system that makes AI coding agents production-safe"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "James Beck"}
]
dependencies = [
    "click>=8.0",
    "tomli>=2.0; python_version < '3.11'",
]
keywords = [
    "ai",
    "llm",
    "coding-agent",
    "constraint-system",
    "hallucination-prevention",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
governor = "governor.cli:main"
fiction-gov = "fiction_governor.cli:main"
nonfiction-gov = "nonfiction_governor.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/agent-governor"
Documentation = "https://github.com/yourusername/agent-governor#readme"
Issues = "https://github.com/yourusername/agent-governor/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/governor", "src/fiction_governor", "src/nonfiction_governor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
