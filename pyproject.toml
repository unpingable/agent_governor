[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-governor"
version = "2.4.0"
description = "Agent Governor - constraint system that makes AI coding agents production-safe"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "James Beck"}
]
dependencies = [
    "click>=8.0",
    "tomli>=2.0; python_version < '3.11'",
    "rich>=13.0",
]
keywords = [
    "ai",
    "llm",
    "coding-agent",
    "constraint-system",
    "hallucination-prevention",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.0",
    "ruff>=0.1.0",
]
webui = [
    "httpx>=0.24.0",
    "pyyaml>=6.0",
]

[project.scripts]
governor = "governor.cli:main"
fiction-gov = "fiction_governor.cli:main"
nonfiction-gov = "nonfiction_governor.cli:main"
ops-gov = "ops_governor.cli:main"

[project.urls]
Homepage = "https://github.com/unpingable/agent_governor"
Documentation = "https://github.com/unpingable/agent_governor#readme"
Issues = "https://github.com/unpingable/agent_governor/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/governor", "src/fiction_governor", "src/nonfiction_governor", "src/ops_governor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 60
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "asyncio: mark test as async",
    "smoke: fresh-clone smoke tests (subprocess + real git)",
    "scale: performance and scale tests (generous bounds)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes (actual errors: undefined names, etc.)
]
ignore = [
    "F401",  # unused imports (common in __init__.py re-exports)
    "F821",  # undefined name (false positives on forward reference type hints)
    "F841",  # unused variables (sometimes intentional)
]

[tool.ruff.format]
quote-style = "double"
